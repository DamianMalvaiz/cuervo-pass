# Documento maestro v5 · §33.
name: CI
on: [push, pull_request]

# Dos pushes seguidos a la misma rama dejaban las dos corridas compitiendo por
# los runners, y la primera ya no le importaba a nadie. `cancel-in-progress`
# hace que la respuesta de CI llegue antes justo cuando más se está iterando.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# §33.3: por omisión el token de Actions tiene permisos de ESCRITURA sobre el
# repositorio. Un paso comprometido podría empujar código. Mínimo privilegio.
permissions:
  contents: read

jobs:
  # §33.1 · AUD-13 — las pruebas de acceso son código, no capturas de pantalla.
  # Una captura no se vuelve a ejecutar, no rompe el build cuando alguien relaja
  # una policy, y se ve idéntica el día que ya es mentira.
  base-de-datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.3.0
      # `@v1` no era una etiqueta: era una RAMA, o sea que su contenido cambia
      # sin que nada aquí lo diga. Y `version: latest` dejaba que el propio CLI
      # cambiara entre dos corridas, así que una prueba podía romperse sin que
      # nadie tocara el repositorio. Se pinea la acción por SHA y el CLI a la
      # versión que se usa en la máquina de desarrollo.
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1   # rama v1 al 19/09/2026
        with: { version: 2.117.0 }
      - run: supabase start
      - run: supabase test db

  # §34 · ORDEN A.3 — el reparto de variables deja de ser un parrafo y pasa a
  # ser una compuerta. Corre sobre los .example, que si se versionan.
  secretos:
    runs-on: ubuntu-latest
    steps:
      # Historial COMPLETO, no el checkout superficial por omisión. En un push, la acción
      # de gitleaks escanea el rango `<primer commit>^..<último>`; sin el padre del primero
      # falla con «unknown revision» y «0 commits scanned», o sea que el job se pone en rojo
      # sin haber escaneado nada. No se notó mientras los pushes eran de un commit: el
      # primero de varios lo rompió. Reproducido con un clon `--depth 1`.
      # test-utils/__tests__/ci-gitleaks-historial-completo.test.ts lo comprueba.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.3.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with: { node-version: 24 }
      - run: node scripts/verificar-env.mjs .env.example .env.server.example
      # Escaneo de secretos sobre el repositorio. Trivy (job `imagen`) mira la
      # imagen de Docker; nadie miraba el arbol, en un proyecto cuyo tema
      # central es el manejo de credenciales.
      - name: Buscar credenciales versionadas
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3   # v2.3.7
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ORDEN A.5 / E.2 — las Edge Functions son la frontera de seguridad (usan
  # service_role) y hasta hoy ningun job las tocaba: ni tipado, ni lint.
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.3.0
      # Versión EXACTA de Deno, no `v2.x`. Con la flotante el job se puso en rojo sin que
      # el repositorio cambiara una línea: Deno 2.9 endureció la resolución de npm y
      # activó una regla de lint nueva. Es lo mismo que se hizo con el CLI de Supabase
      # (arriba) y con las acciones, fijadas por SHA. Subirla es una decisión: se cambia
      # aquí, se corre el job y se ve qué rompe. test-utils/__tests__/ci-sin-versiones-
      # flotantes.test.ts lo comprueba. 2.9.7 es la que se reprodujo y verificó.
      - uses: denoland/setup-deno@909cc5acb0fdd60627fb858598759246509fa755   # v2.0.2
        with: { deno-version: 2.9.7 }
      # `--node-modules-dir=none`: en la raíz hay un package.json (el de la app), y Deno
      # lo toma como espacio de trabajo y resuelve las dependencias npm de `supabase-js`
      # en `node_modules`. Aquí no hay `npm ci` —y no debe haberlo: instalaría el árbol
      # entero de Expo para comprobar cuatro funciones—, así que fallaba con «Could not
      # find a matching package for npm:@supabase/realtime-js». Con `none` Deno usa su
      # propia caché. Un `deno.json` dentro de supabase/functions NO lo arregla (se probó):
      # Deno sigue usando el package.json de la raíz.
      - run: deno check --node-modules-dir=none supabase/functions/*/index.ts
      # `no-import-prefix` prohíbe los imports `jsr:` en línea. Las funciones los usan a
      # propósito: es el patrón de la documentación de Edge Functions, cada función se
      # despliega por separado, y la versión queda fijada en deno.lock. Moverlos a un
      # import map cambiaría cómo se empaquetan en el despliegue, que aquí no se puede
      # probar. Es la única regla de lint que falla.
      - run: deno lint --rules-exclude=no-import-prefix supabase/functions/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        # Node 24, el mismo que se usa para desarrollar, y no 20: `@supabase/supabase-js` y
        # `@supabase/realtime-js` declaran `engines.node >= 22` porque necesitan el WebSocket
        # nativo de Node 22. Con Node 20, `createClient` lanza «native WebSocket not found» y
        # las seis suites que importan el cliente real ni arrancan (66 pruebas sin
        # ejecutarse). Quedó oculto porque el job fallaba antes, en `npm audit`, y nunca
        # llegaba a las pruebas. React Native 0.86 admite 20.19, 22.13 y 24.3.
        # test-utils/__tests__/ci-node-cumple-las-dependencias.test.ts lee el mínimo del
        # paquete instalado, no de un número copiado aquí.
        with: { node-version: 24, cache: npm }
      # §33.3: `npm ci` instala exactamente el package-lock.json. `npm install`
      # puede resolver versiones distintas y hacer que CI y la laptop difieran,
      # que es el peor lugar donde descubrir una diferencia.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # END-29 · El contraste se MIDE, no se anota a mano. `theme.ts` afirmaba
      # que todos sus contrastes estaban medidos y era verdad a medias: se
      # midieron doce pares de texto sobre fondo y ninguna superficie contra
      # superficie, que era justo la que fallaba — 1.00 contra el papel.
      # Vulnerabilidades de las DEPENDENCIAS. Trivy mira la imagen de Docker del
      # microservicio; nadie miraba node_modules, que es donde vive la mayor
      # parte del código de terceros que acaba en el APK.
      #
      # La puerta NO es `npm audit --audit-level=high`, que estaba en rojo y no se podía
      # poner en verde subiendo dependencias. Medido el 15/10/2026: 66 paquetes
      # afectados son 7 avisos, y de los altos que quedaban, `braces` y `node-forge` ya
      # están en su última versión publicada y el aviso cubre esa versión: NO EXISTE una
      # corrección. Ninguno está en el bundle de producción de la app (verificado con un
      # `expo export` de Android): son herramientas de compilación y de pruebas.
      #
      # Las dos salidas fáciles eran malas: dejarlo en rojo entrena a ignorar el rojo, y
      # bajar el umbral a `critical` deja pasar cualquier aviso alto futuro. Esta puerta
      # falla ante todo aviso alto o crítico NUEVO, permite los conocidos por nombre y
      # con un motivo escrito (scripts/audit-excepciones.json), y se pone en rojo
      # también si una excepción deja de valer: ya hay corrección, ya no aparece, o
      # venció su fecha de revisión. Ver scripts/verificar-audit.mjs.
      #
      # El umbral sigue siendo `high`: lo moderado se ve en `npm audit` y no rompe el
      # CI. test-utils/__tests__/ci-audit-con-excepciones.test.ts impide volver al
      # comando a secas.
      - run: npm run verificar:audit
      - run: npm run verificar:contraste
      # END-35 · El invariante 8 dice «44×44 pt, sin excepciones» y vivía solo
      # en AGENTS.md: había cinco controles por debajo —30, 32, 36, 38 y 40—
      # porque una regla que solo está escrita depende de que alguien la
      # recuerde al teclear cada estilo.
      - run: npm run verificar:toques
      # END-22 · Con `--coverage`, y no es lo mismo que `npm test`.
      #
      # `--passWithNoTests` se retira a proposito: existia para que el job no
      # fallara cuando no habia pruebas, y hoy hay 288. Dejarlo significa que si
      # un cambio rompe el descubrimiento de tests —un `testMatch` mal escrito,
      # un `modulePathIgnorePatterns` de mas— el job saldria VERDE sin ejecutar
      # ninguna. Ese es el peor verde posible.
      #
      # Los umbrales viven en jest.config.js y solo suben. Si este paso falla
      # por cobertura, la respuesta es escribir la prueba que falta, nunca bajar
      # el numero.
      - run: npm test -- --watchAll=false --coverage

  servicio-ia:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ai-service }
    env:
      # Vacío A PROPÓSITO: lo que se prueba es la degradación. Un test que gasta
      # dinero en la API y falla cuando se cae la red no es un test, es una
      # fuente de falsos negativos.
      #
      # Esto además es lo que hacía fallar el workflow de v3 en el primer push:
      # models/parseo_llm.py leía os.environ["ANTHROPIC_API_KEY"] en tiempo de
      # import, así que pytest no podía ni importar el módulo (§21).
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: { python-version: "3.11", cache: pip }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.2.3
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('ai-service/requirements.txt') }}
      # requirements-dev.txt trae pytest y httpx, que el Dockerfile NO instala:
      # las pruebas no tienen por qué viajar dentro de la imagen de producción.
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt -r requirements-dev.txt
      # config.py carga ai-service/.env por su cuenta (ORDEN A.2). El archivo no
      # se versiona, así que CI lo crea desde la plantilla igual que hace el
      # README en una máquina nueva. Sin esto,
      # test_config_carga_el_env_del_microservicio falla — y debe fallar: es la
      # prueba de que el cargador existe.
      - run: cp .env.example .env
      - run: pytest tests -v

  imagen:
    runs-on: ubuntu-latest
    needs: servicio-ia
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.3.0
      - run: docker build -t ia:${{ github.sha }} ./ai-service
      - name: Vulnerabilidades
        # `@master` en un job de SEGURIDAD: cualquier commit en esa rama entra
        # aquí sin revisión. Es justo lo que el comentario de `npm ci` de más
        # arriba condena, en el sitio donde más caro sale.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          image-ref: ia:${{ github.sha }}
          severity: CRITICAL,HIGH
          # Que rompa el build, no que informe: §33.3, un reporte que nadie lee
          # no es un control.
          exit-code: '1'
          # Solo falla ante lo que se puede accionar. La imagen base
          # (python:3.11-slim, Debian 13) arrastra 54 HIGH y 3 CRITICAL del
          # sistema operativo SIN parche publicado: la columna "Fixed Version"
          # viene vacía. Sin esta línea el job queda en rojo permanentemente
          # hagas lo que hagas, y una compuerta que siempre está roja se acaba
          # ignorando o apagando — que es exactamente lo que §33.3 quiere
          # evitar. Lo que sí tiene parche se corrige subiendo la versión en
          # requirements.txt, no silenciándolo aquí.
          ignore-unfixed: true
          # Excepciones con justificación escrita, una por una. Hoy solo
          # contiene las dos que pip empaqueta dentro de sí mismo y que ninguna
          # versión de pip trae corregidas.
          trivyignores: ai-service/.trivyignore
      # Antes: `curl … install.sh | sh` desde la rama `main` de otro proyecto.
      # Descargar y EJECUTAR un script que puede cambiar en cualquier momento,
      # con permisos de escritura en /usr/local/bin, dentro del job que produce
      # el inventario de seguridad. La acción oficial está pineada por SHA.
      - name: Inventario de componentes
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26   # v0.24.2
        with:
          image: ia:${{ github.sha }}
          format: spdx-json
          output-file: sbom.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with: { name: sbom, path: sbom.json }
