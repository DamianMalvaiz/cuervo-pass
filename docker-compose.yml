# Documento maestro v5 · §23.
services:
  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    restart: unless-stopped
    volumes:
      # El modelo sobrevive a los rebuilds: sin este volumen, cada `docker
      # compose build` vuelve a bajar ~470 MB.
      - hf-cache:/opt/hf

volumes:
  hf-cache:
